name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check documentation links
        run: npm run docs:check

      - name: Type-check source and tests
        run: npm run typecheck

      - name: Run test suite
        run: npm run test

      - name: Build CLI and Runtime
        run: npm run build

      - name: Run deterministic recruiter portfolio demo
        run: npm run demo:portfolio
