name: Offline behavioral eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI Responses API model ID
        required: true
        type: string
      provider_id:
        default: openai
        description: Stable provider identity; change it for a custom OPENAI_BASE_URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EVAL_MODEL: ${{ inputs.model }}
      EVAL_PROVIDER_ID: ${{ inputs.provider_id }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical eval
        id: eval
        shell: bash
        run: |
          set +e
          npm run eval -- run --model "${EVAL_MODEL}" --provider-id "${EVAL_PROVIDER_ID}"
          exit_code=$?
          run_root="$(find .forge/evals -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null | sort | tail -n 1)"
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          echo "run_root=${run_root}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Write eval summary
        if: always()
        shell: bash
        run: |
          run_root="${{ steps.eval.outputs.run_root }}"
          if [[ -n "${run_root}" && -f "${run_root}/report.md" ]]; then
            cat "${run_root}/report.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            printf '%s\n' '# Forge Offline Eval' '' 'No regression report was produced.' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload sanitized reports
        if: always() && steps.eval.outputs.run_root != ''
        uses: actions/upload-artifact@v6
        with:
          name: forge-offline-eval-${{ github.run_id }}
          path: |
            ${{ steps.eval.outputs.run_root }}/summary.json
            ${{ steps.eval.outputs.run_root }}/report.json
            ${{ steps.eval.outputs.run_root }}/report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Apply eval exit code
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.eval.outputs.exit_code }}"
          if [[ ! "${exit_code}" =~ ^[012]$ ]]; then
            exit_code=2
          fi
          exit "${exit_code}"
