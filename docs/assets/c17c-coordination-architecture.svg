<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">c17c Coordination Architecture and Fact Ownership</title>
  <desc id="desc">Leader and teammate models call role-scoped task tools. TaskGraphStore, child terminal registry, TeammateManager, and GitIntegrationService own separate facts. CompletionGate reads their projections before root verification.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 26px ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .subtitle { font: 15px ui-sans-serif, system-ui, sans-serif; fill: #4b5563; }
      .actor { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
      .tools { fill: #fdf4ff; stroke: #a21caf; stroke-width: 2.4; }
      .graph { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.4; }
      .source { fill: #ecfeff; stroke: #0e7490; stroke-width: 2.4; }
      .team { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2.4; }
      .git { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.4; }
      .gate { fill: #ecfdf5; stroke: #047857; stroke-width: 2.8; }
      .verify { fill: #f0fdf4; stroke: #15803d; stroke-width: 2.4; }
      .label { font: 700 18px ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .small { font: 14px ui-sans-serif, system-ui, sans-serif; fill: #374151; }
      .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1f2937; }
      .column { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #475569; letter-spacing: .04em; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .write { stroke: #c2410c; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .read { stroke: #047857; stroke-width: 2.2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="780" />
  <text class="title" x="48" y="48">c17c：协调事实分散持有，CompletionGate 只读收口</text>
  <text class="subtitle" x="48" y="77">模型只能通过角色级工具推进协议；每个模块保存自己的权威事实，不新增中央“超级协调器”。</text>

  <text class="column" x="54" y="121">ACTOR</text>
  <rect class="actor" x="48" y="138" width="220" height="82" rx="10" />
  <text class="label" x="78" y="166">Leader model</text>
  <text class="mono" x="78" y="191">assign · review</text>
  <text class="mono" x="78" y="210">verify · integrate</text>

  <rect class="actor" x="298" y="138" width="220" height="82" rx="10" />
  <text class="label" x="328" y="166">teammate model</text>
  <text class="mono" x="328" y="191">claim · plan</text>
  <text class="mono" x="328" y="210">evidence · submit</text>

  <text class="column" x="642" y="121">PROTOCOL ACTION BOUNDARY</text>
  <rect class="tools" x="616" y="132" width="350" height="94" rx="11" />
  <text class="label" x="646" y="166">role-scoped task tools</text>
  <text class="mono" x="646" y="192">task_transition · task_verify</text>
  <text class="mono" x="646" y="211">task_integrate · teammate_shutdown</text>

  <path class="arrow" d="M 158 220 C 158 258 570 258 616 188" />
  <path class="arrow" d="M 518 197 L 616 197" />

  <text class="column" x="52" y="282">MODULE-OWNED FACTS</text>

  <rect class="graph" x="48" y="302" width="312" height="178" rx="12" />
  <text class="label" x="72" y="336">TaskGraphStore v2</text>
  <text class="small" x="72" y="365">权威 task contract 与 owner</text>
  <text class="mono" x="72" y="394">status · plan · submission</text>
  <text class="mono" x="72" y="418">verdict · handoff · blocker</text>
  <text class="mono" x="72" y="442">integration receipt · trace history</text>
  <text class="small" x="72" y="465">file lock · revision · atomic write</text>

  <rect class="source" x="392" y="302" width="312" height="178" rx="12" />
  <text class="label" x="416" y="336">child terminal registry</text>
  <text class="small" x="416" y="365">可信 one-shot result source</text>
  <text class="mono" x="416" y="394">childSessionId → original taskId</text>
  <text class="mono" x="416" y="418">profile · terminal result</text>
  <text class="mono" x="416" y="442">workspace · changedFiles · handoff</text>
  <text class="small" x="416" y="465">同一 source 不能跨 task 重用</text>

  <rect class="team" x="736" y="302" width="312" height="178" rx="12" />
  <text class="label" x="760" y="336">TeammateManager</text>
  <text class="small" x="760" y="365">长期成员的 live state</text>
  <text class="mono" x="760" y="394">name · sessionId · profile</text>
  <text class="mono" x="760" y="418">workspace · mailbox · unreadCount</text>
  <text class="mono" x="760" y="442">starting / busy / idle / stopped</text>
  <text class="small" x="760" y="465">shutdown 不等于 task ownership</text>

  <rect class="git" x="1080" y="302" width="312" height="178" rx="12" />
  <text class="label" x="1104" y="336">GitIntegrationService</text>
  <text class="small" x="1104" y="365">source 与 target 的 Git 边界</text>
  <text class="mono" x="1104" y="394">diff · changedFiles · fingerprint</text>
  <text class="mono" x="1104" y="418">contract verification · outcome</text>
  <text class="mono" x="1104" y="442">source commit · cherry-pick</text>
  <text class="small" x="1104" y="465">成功后把 receipt 写回 TaskGraph</text>

  <path class="arrow" d="M 704 226 C 650 255 320 258 204 302" />
  <path class="arrow" d="M 754 226 C 704 258 610 268 548 302" />
  <path class="arrow" d="M 820 226 C 830 260 862 270 892 302" />
  <path class="arrow" d="M 900 226 C 980 260 1150 266 1236 302" />
  <path class="write" d="M 1236 480 C 1236 542 500 542 204 480" />
  <text class="small" x="646" y="532">receipt / blocker 写回 task state</text>

  <rect class="gate" x="382" y="566" width="652" height="112" rx="13" />
  <text class="label" x="412" y="599">CompletionGate（只读 projection）</text>
  <text class="mono" x="412" y="628">tasks completed · teammates stopped · no unread mailbox</text>
  <text class="mono" x="412" y="651">no child/background activity · no cherry-pick in progress</text>

  <path class="read" d="M 204 480 L 510 566" />
  <path class="read" d="M 548 480 L 616 566" />
  <path class="read" d="M 892 480 L 804 566" />
  <path class="read" d="M 1236 480 L 924 566" />

  <rect class="verify" x="1112" y="579" width="280" height="86" rx="11" />
  <text class="label" x="1138" y="612">root --verify</text>
  <text class="small" x="1138" y="640">仅在 gate = ready 后运行</text>
  <path class="read" d="M 1034 622 L 1112 622" />

  <text class="small" x="48" y="738">实线表示协议动作或写入；绿色虚线表示 CompletionGate 的只读检查。颜色之外，模块名称与事实清单也明确标出 owner。</text>
</svg>
